<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HopePaw: Run for Hope 🐾</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0d1b2a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 600px;
      background: linear-gradient(180deg, #1b263b 0%, #415a77 100%);
      border: 3px solid #77abb7;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .ui-layer {
      position: absolute;
      top: 15px; left: 15px; right: 15px;
      display: flex; justify-content: space-between;
      font-weight: bold; font-size: 16px;
      pointer-events: none;
      z-index: 10;
    }
    .touch-controls {
      position: absolute;
      bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: space-around;
      padding: 0 20px;
      z-index: 10;
    }
    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid #fff;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-layer">
      <div>HOPE SCORE: <span id="scoreText" style="color: #e0a96d;">0</span></div>
      <div>DIST: <span id="distText">0</span>m</div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <!-- Tombol Sentuh Layar HP -->
    <div class="touch-controls">
      <button class="btn" id="btnLeft">◄ Kiri</button>
      <button class="btn" id="btnJump">▲ Lompat</button>
      <button class="btn" id="btnSlide">▼ Slide</button>
      <button class="btn" id="btnRight">Kanan ►</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Load Gambar
    const imgRun = new Image(); imgRun.src = 'hopepaw-run.png';
    const imgJump = new Image(); imgJump.src = 'hopepaw-jump.png';
    const imgSlide = new Image(); imgSlide.src = 'hopepaw-slide.png';

    const lanes = [80, 200, 320];
    const player = {
      lane: 1,
      x: lanes[1],
      y: 440,
      width: 90,
      height: 90,
      targetX: lanes[1],
      isJumping: false,
      isSliding: false,
      jumpOffset: 0,
      jumpSpeed: 0,
      slideTimer: 0
    };

    // Kontrol Tombol HP
    document.getElementById('btnLeft').onclick = () => { if (player.lane > 0) player.lane--; };
    document.getElementById('btnRight').onclick = () => { if (player.lane < 2) player.lane++; };
    document.getElementById('btnJump').onclick = () => { if (!player.isJumping) triggerJump(); };
    document.getElementById('btnSlide').onclick = () => { if (!player.isSliding) triggerSlide(); };

    // Kontrol Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && player.lane > 0) player.lane--;
      if (e.key === 'ArrowRight' && player.lane < 2) player.lane++;
      if (e.key === 'ArrowUp' && !player.isJumping) triggerJump();
      if (e.key === 'ArrowDown' && !player.isSliding) triggerSlide();
    });

    function triggerJump() { player.isJumping = true; player.jumpSpeed = 12; }
    function triggerSlide() { player.isSliding = true; player.slideTimer = 25; }

    function update() {
      player.targetX = lanes[player.lane];
      player.x += (player.targetX - player.x) * 0.2;

      if (player.isJumping) {
        player.jumpOffset += player.jumpSpeed;
        player.jumpSpeed -= 0.8;
        if (player.jumpOffset <= 0) { player.jumpOffset = 0; player.isJumping = false; }
      }

      if (player.isSliding) {
        player.slideTimer--;
        if (player.slideTimer <= 0) player.isSliding = false;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Garis Jalur
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(140, 0); ctx.lineTo(140, 600);
      ctx.moveTo(260, 0); ctx.lineTo(260, 600);
      ctx.stroke();

      // Pilih Pose Gambar
      let currentImg = imgRun;
      let drawW = player.width;
      let drawH = player.height;

      if (player.isJumping) currentImg = imgJump;
      if (player.isSliding) { currentImg = imgSlide; drawH = 55; }

      // Gambar Karakter
      ctx.drawImage(currentImg, player.x - drawW / 2, player.y - player.jumpOffset - drawH / 2, drawW, drawH);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
