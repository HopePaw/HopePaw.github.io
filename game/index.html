<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>HopePaw: Run for Hope</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d1b2a;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    position: relative;
    width: 400px;
    height: 600px;
    max-width: 100vw;
    max-height: 100vh;
    background: #1b263b;
    border: 2px solid #77abb7;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#score {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;

    display: flex;
    justify-content: space-between;

    color: white;
    font-size: 18px;
    font-weight: bold;

    z-index: 10;
}

#status {
    position: absolute;
    top: 50px;
    left: 0;
    width: 100%;

    text-align: center;

    color: #77abb7;
    font-size: 12px;

    z-index: 10;
}

.buttons {
    position: absolute;
    bottom: 10px;
    left: 10px;
    right: 10px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 6px;

    z-index: 20;
}

button {
    border: 0;
    border-radius: 8px;

    padding: 15px 2px;

    background: #505b72;
    color: white;

    font-weight: bold;
}

button:active {
    background: #71809e;
}

</style>
</head>

<body>

<div id="game">

    <div id="score">
        <div>SCORE: <span id="scoreValue">0</span></div>
        <div>DIST: <span id="distValue">0</span>m</div>
    </div>

    <div id="status">
        HopePaw loading...
    </div>

    <canvas
        id="canvas"
        width="400"
        height="600">
    </canvas>

    <div class="buttons">

        <button onclick="left()">
            ◄ Kiri
        </button>

        <button onclick="jump()">
            ▲ Lompat
        </button>

        <button onclick="slide()">
            ▼ Slide
        </button>

        <button onclick="right()">
            Kanan ►
        </button>

    </div>

</div>


<script>

/* ============================
   CANVAS
============================ */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/* ============================
   HOPEPAW
============================ */

const hopepaw =
    new Image();

hopepaw.src =
    "hopepaw-run.png";


/* ============================
   PLAYER
============================ */

let lane = 1;

let x = 200;

let y = 500;

let distance = 0;


/* ============================
   IMAGE LOADED
============================ */

hopepaw.onload = function() {

    document.getElementById("status").innerText =
        "🐾 HopePaw loaded!";

};


hopepaw.onerror = function() {

    document.getElementById("status").innerText =
        "❌ HopePaw image error";

};


/* ============================
   CONTROLS
============================ */

function left() {

    if (lane > 0) {
        lane--;
    }

    updatePosition();
}


function right() {

    if (lane < 2) {
        lane++;
    }

    updatePosition();
}


function updatePosition() {

    if (lane === 0) {
        x = 65;
    }

    if (lane === 1) {
        x = 200;
    }

    if (lane === 2) {
        x = 335;
    }

}


function jump() {

    y = 430;

    setTimeout(function() {

        y = 500;

    }, 500);

}


function slide() {

    document.getElementById("status").innerText =
        "🐾 HopePaw sliding!";

    setTimeout(function() {

        document.getElementById("status").innerText =
            "🐾 HopePaw loaded!";

    }, 500);

}


/* ============================
   DRAW
============================ */

function draw() {

    /* Background */

    ctx.fillStyle =
        "#1b263b";

    ctx.fillRect(
        0,
        0,
        400,
        600
    );


    /* Lane lines */

    ctx.strokeStyle =
        "rgba(255,255,255,0.15)";

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.moveTo(133, 0);
    ctx.lineTo(133, 600);

    ctx.moveTo(266, 0);
    ctx.lineTo(266, 600);

    ctx.stroke();


    /* Ground */

    ctx.strokeStyle =
        "rgba(255,255,255,0.12)";

    ctx.beginPath();

    ctx.moveTo(0, 550);
    ctx.lineTo(400, 550);

    ctx.stroke();


    /* HopePaw */

    if (
        hopepaw.complete &&
        hopepaw.naturalWidth > 0
    ) {

        ctx.drawImage(
            hopepaw,
            x - 50,
            y - 50,
            100,
            100
        );

    }


    /* Distance */

    distance += 0.05;

    document.getElementById(
        "distValue"
    ).innerText =
        Math.floor(distance);

    document.getElementById(
        "scoreValue"
    ).innerText =
        Math.floor(distance);


    requestAnimationFrame(draw);

}


/* ============================
   START
============================ */

updatePosition();

draw();

</script>

</body>
</html>
