<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HopePaw: Run for Hope</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #0d1b2a; font-family: Arial, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; }
    #game-container { position: relative; width: 100vw; max-width: 400px; height: 100vh; max-height: 700px; background: #1b263b; border: 2px solid #77abb7; border-radius: 16px; overflow: hidden; }
    #gameCanvas { display: block; width: 100%; height: 100%; }
    .ui { position: absolute; top: 18px; left: 18px; right: 18px; display: flex; justify-content: space-between; color: white; font-size: 16px; font-weight: bold; z-index: 10; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .controls { position: absolute; left: 0; bottom: 14px; width: 100%; padding: 0 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; z-index: 20; }
    .btn { background: rgba(255,255,255,0.25); color: white; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 16px 2px; text-align: center; font-size: 14px; font-weight: bold; user-select: none; touch-action: manipulation; transition: transform 0.08s, background 0.08s; }
    .btn:active { background: rgba(255,255,255,0.45); transform: scale(0.95); }
    @media (max-width: 400px) {
      #game-container { width: 100vw; height: 100vh; max-width: none; max-height: none; border-radius: 0; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui">
      <div>PAW COINS: <span id="coins" style="color: #4fc3f7;">0</span></div>
      <div>DIST: <span id="dist">0</span>m</div>
    </div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="controls">
      <div class="btn" id="bL">◄ Kiri</div>
      <div class="btn" id="bJ">▲ Lompat</div>
      <div class="btn" id="bS">▼ Slide</div>
      <div class="btn" id="bR">Kanan ►</div>
    </div>
  </div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // Game state
  let gameOver = false;
  let gameSpeed = 5;
  let roadOffset = 0;

  const player = { lane: 1, x: 200, y: 480, jump: 0, jumpPower: 0, sliding: false, dist: 0, coins: 0 };
  const lanes = [75, 200, 325];

  let trees = [];
  let obstacles = [];
  let coinItems = [];

  // Inisialisasi Elemen
  for (let i = 0; i < 6; i++) {
    trees.push({ y: i * 120, side: i % 2 === 0 ? 'left' : 'right' });
  }

  function updatePlayerPosition() {
    player.x = lanes[player.lane];
  }

  function moveLeft() { if (!gameOver && player.lane > 0) { player.lane--; updatePlayerPosition(); } }
  function moveRight() { if (!gameOver && player.lane < 2) { player.lane++; updatePlayerPosition(); } }
  function jump() { if (!gameOver && player.jump === 0 && !player.sliding) { player.jump = 1; player.jumpPower = 17; } }
  function slide() { if (!gameOver && player.jump === 0) { player.sliding = true; setTimeout(() => { player.sliding = false; }, 650); } }

  // Rest restart game
  function resetGame() {
    gameOver = false;
    gameSpeed = 5;
    player.lane = 1;
    player.dist = 0;
    player.coins = 0;
    player.jump = 0;
    player.sliding = false;
    obstacles = [];
    coinItems = [];
    updatePlayerPosition();
    document.getElementById("coins").innerText = "0";
    loop();
  }

  // Event Control
  document.getElementById("bL").addEventListener("touchstart", (e) => { e.preventDefault(); moveLeft(); }, { passive: false });
  document.getElementById("bR").addEventListener("touchstart", (e) => { e.preventDefault(); moveRight(); }, { passive: false });
  document.getElementById("bJ").addEventListener("touchstart", (e) => { e.preventDefault(); jump(); }, { passive: false });
  document.getElementById("bS").addEventListener("touchstart", (e) => { e.preventDefault(); slide(); }, { passive: false });

  document.getElementById("bL").addEventListener("click", moveLeft);
  document.getElementById("bR").addEventListener("click", moveRight);
  document.getElementById("bJ").addEventListener("click", jump);
  document.getElementById("bS").addEventListener("click", slide);

  canvas.addEventListener("click", () => { if (gameOver) resetGame(); });

  // MENGGAMBAR MASKOT HOPEPAW (VECTOR)
  function drawHopePaw(x, y, isSliding, jumpH) {
    ctx.save();
    ctx.translate(x, y - jumpH);

    // Bayangan
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(0, jumpH + 25, isSliding ? 30 : 20, 8, 0, 0, Math.PI * 2); ctx.fill();

    // Badan Emas
    ctx.fillStyle = "#E5A93C";
    if (isSliding) {
      ctx.beginPath(); ctx.ellipse(0, 10, 32, 16, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
    }

    // Telinga
    ctx.fillStyle = "#C68223";
    ctx.beginPath(); ctx.ellipse(-20, -10, 7, 15, Math.PI / 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(20, -10, 7, 15, -Math.PI / 6, 0, Math.PI * 2); ctx.fill();

    // Syal Biru
    ctx.fillStyle = "#1E88E5";
    ctx.beginPath(); ctx.arc(0, 6, 20, 0.2 * Math.PI, 0.8 * Math.PI); ctx.lineWidth = 6; ctx.strokeStyle = "#1E88E5"; ctx.stroke();

    // Paw Logo Putih di Syal
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath(); ctx.arc(0, 15, 3.5, 0, Math.PI * 2); ctx.fill();

    // Wajah
    ctx.fillStyle = "#222222";
    ctx.beginPath(); ctx.arc(-8, -4, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -4, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 2, 4.5, 3, 0, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  // MENGGAMBAR POHON
  function drawTree(x, y) {
    ctx.fillStyle = "#5D4037"; ctx.fillRect(x - 6, y, 12, 24); // Batang
    ctx.fillStyle = "#2E7D32"; ctx.beginPath(); ctx.arc(x, y - 10, 22, 0, Math.PI * 2); ctx.fill(); // Daun Utama
    ctx.fillStyle = "#388E3C"; ctx.beginPath(); ctx.arc(x - 8, y - 16, 14, 0, Math.PI * 2); ctx.fill(); // Highlight
  }

  // MENGGAMBAR KOIN PAW
  function drawCoin(x, y) {
    ctx.fillStyle = "#0288D1"; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4FC3F7"; ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(x, y + 2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 4, y - 3, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 4, y - 3, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y - 5, 1.5, 0, Math.PI * 2); ctx.fill();
  }

  // MENGGAMBAR RINTANGAN
  function drawObstacle(obs) {
    ctx.save();
    if (obs.type === 'low') { // Pagar Kayu (Harus di-Lompat)
      ctx.fillStyle = "#8D6E63"; ctx.fillRect(obs.x - 30, obs.y - 15, 60, 20);
      ctx.fillStyle = "#5D4037"; ctx.fillRect(obs.x - 25, obs.y - 25, 10, 30); ctx.fillRect(obs.x + 15, obs.y - 25, 10, 30);
      ctx.fillStyle = "#FF5252"; ctx.font = "bold 10px Arial"; ctx.fillText("LOMPAT", obs.x - 21, obs.y - 2);
    } else if (obs.type === 'high') { // Banner Gantung (Harus di-Slide)
      ctx.fillStyle = "#37474F"; ctx.fillRect(obs.x - 35, obs.y - 65, 8, 65); ctx.fillRect(obs.x + 27, obs.y - 65, 8, 65);
      ctx.fillStyle = "#FF9800"; ctx.fillRect(obs.x - 30, obs.y - 60, 60, 28);
      ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 11px Arial"; ctx.fillText("SLIDE!", obs.x - 18, obs.y - 42);
    }
    ctx.restore();
  }

  // GAME LOOP
  function loop() {
    ctx.clearRect(0, 0, 400, 600);

    // 1. Gambar Rumput & Jalan
    ctx.fillStyle = "#1b263b"; ctx.fillRect(0, 0, 400, 600); // Background Luar
    ctx.fillStyle = "#2c3e50"; ctx.fillRect(20, 0, 360, 600); // Jalanan Utama

    // Garis Pinggir Jalan
    ctx.fillStyle = "#77abb7"; ctx.fillRect(20, 0, 6, 600); ctx.fillRect(374, 0, 6, 600);

    // Garis Putih Putus-putus (Animasi Gerak Jalan)
    roadOffset = (roadOffset + gameSpeed) % 40;
    ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 3; ctx.setLineDash([20, 20]); ctx.lineDashOffset = -roadOffset;
    ctx.beginPath(); ctx.moveTo(138, 0); ctx.lineTo(138, 600); ctx.moveTo(262, 0); ctx.lineTo(262, 600); ctx.stroke();
    ctx.setLineDash([]);

    // 2. Gambar & Update Pohon
    trees.forEach(tree => {
      tree.y += gameSpeed;
      if (tree.y > 630) tree.y = -30;
      drawTree(tree.side === 'left' ? 10 : 390, tree.y);
    });

    // 3. Spawning Rintangan & Koin
    if (Math.random() < 0.02) {
      let laneIdx = Math.floor(Math.random() * 3);
      let type = Math.random() > 0.5 ? 'low' : 'high';
      // Pastikan tidak ada rintangan yang terlalu dekat
      if (obstacles.length === 0 || obstacles[obstacles.length - 1].y > 180) {
        obstacles.push({ x: lanes[laneIdx], y: -40, lane: laneIdx, type: type });
      }
    }

    if (Math.random() < 0.035) {
      let laneIdx = Math.floor(Math.random() * 3);
      if (coinItems.length === 0 || coinItems[coinItems.length - 1].y > 100) {
        coinItems.push({ x: lanes[laneIdx], y: -30, lane: laneIdx });
      }
    }

    // 4. Update & Draw Koin
    for (let i = coinItems.length - 1; i >= 0; i--) {
      let coin = coinItems[i];
      coin.y += gameSpeed;
      drawCoin(coin.x, coin.y);

      // Cek Ambil Koin
      if (Math.abs(coin.y - player.y) < 25 && coin.lane === player.lane && player.jump === 0) {
        player.coins += 1;
        document.getElementById("coins").innerText = player.coins;
        coinItems.splice(i, 1);
      } else if (coin.y > 620) {
        coinItems.splice(i, 1);
      }
    }

    // 5. Update & Draw Rintangan + Deteksi Tabrakan
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      obs.y += gameSpeed;
      drawObstacle(obs);

      // Cek Tabrakan
      if (Math.abs(obs.y - player.y) < 22 && obs.lane === player.lane) {
        if (obs.type === 'low' && player.jump === 0) {
          gameOver = true;
        } else if (obs.type === 'high' && !player.sliding) {
          gameOver = true;
        }
      }

      if (obs.y > 640) obstacles.splice(i, 1);
    }

    // 6. Fisika Lompat & Update Jarak
    if (!gameOver) {
      if (player.jump > 0) {
        player.jumpPower -= 1;
        if (player.jumpPower <= -17) { player.jump = 0; player.jumpPower = 0; }
      }
      player.dist += 0.1;
      gameSpeed = 5 + Math.floor(player.dist / 50) * 0.5; // Makin lama makin cepat!
      document.getElementById("dist").innerText = Math.floor(player.dist);
    }

    let jumpH = (player.jump > 0) ? (17 * 17 - Math.pow(player.jumpPower, 2)) * 0.42 : 0;

    // 7. Render Karakter HopePaw
    drawHopePaw(player.x, player.y, player.sliding, jumpH);

    // 8. Tampilan Game Over
    if (gameOver) {
      ctx.fillStyle = "rgba(13, 27, 42, 0.85)";
      ctx.fillRect(0, 0, 400, 600);

      ctx.fillStyle = "#FF5252"; ctx.font = "bold 28px Arial"; ctx.textAlign = "center";
      ctx.fillText("GAME OVER", 200, 240);

      ctx.fillStyle = "#FFFFFF"; ctx.font = "16px Arial";
      ctx.fillText("Jarak: " + Math.floor(player.dist) + "m", 200, 280);
      ctx.fillText("Koin Paw: " + player.coins, 200, 310);

      ctx.fillStyle = "#4FC3F7"; ctx.font = "bold 16px Arial";
      ctx.fillText("Ketuk Layar untuk Main Lagi 🐾", 200, 370);
      return;
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
