<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HopePaw: Run for Hope 🐾</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0d1b2a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 90vh;
      max-height: 750px;
      background: linear-gradient(180deg, #1b263b 0%, #415a77 100%);
      border: 2px solid #77abb7;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .ui-layer {
      position: absolute;
      top: 15px; left: 15px; right: 15px;
      display: flex; justify-content: space-between;
      font-weight: bold; font-size: 15px;
      pointer-events: none;
      z-index: 10;
      text-shadow: 1px 1px 3px #000;
    }
    .touch-controls {
      position: absolute;
      bottom: 20px; left: 10px; right: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      z-index: 10;
    }
    .btn {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: #fff;
      padding: 14px 0;
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      text-align: center;
      backdrop-filter: blur(4px);
      touch-action: manipulation;
    }
    .btn:active { background: rgba(224, 169, 109, 0.6); }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-layer">
      <div>HOPE SCORE: <span id="scoreText" style="color: #e0a96d;">0</span></div>
      <div>DIST: <span id="distText">0</span>m</div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <div class="touch-controls">
      <div class="btn" id="btnLeft">◄ Kiri</div>
      <div class="btn" id="btnJump">▲ Lompat</div>
      <div class="btn" id="btnSlide">▼ Slide</div>
      <div class="btn" id="btnRight">Kanan ►</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // System Pemuatan Gambar
    const assets = {
      run: './hopepaw-run.png',
      jump: './hopepaw-jump.png',
      slide: './hopepaw-slide.png'
    };

    const imgs = {};
    let loadedCount = 0;
    const totalAssets = Object.keys(assets).length;

    for (let key in assets) {
      imgs[key] = new Image();
      imgs[key].src = assets[key];
      imgs[key].onload = () => {
        loadedCount++;
        if (loadedCount === totalAssets) {
          requestAnimationFrame(gameLoop);
        }
      };
    }

    const lanes = [80, 200, 320];
    const player = {
      lane: 1,
      x: lanes[1],
      y: 460,
      width: 90,
      height: 90,
      targetX: lanes[1],
      isJumping: false,
      isSliding: false,
      jumpOffset: 0,
      jumpSpeed: 0,
      slideTimer: 0
    };

    // Control Event Listeners
    const bindControl = (id, action) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); action(); });
      el.onclick = action;
    };

    bindControl('btnLeft', () => { if (player.lane > 0) player.lane--; });
    bindControl('btnRight', () => { if (player.lane < 2) player.lane++; });
    bindControl('btnJump', () => { if (!player.isJumping) { player.isJumping = true; player.jumpSpeed = 13; } });
    bindControl('btnSlide', () => { if (!player.isSliding) { player.isSliding = true; player.slideTimer = 25; } });

    function update() {
      player.targetX = lanes[player.lane];
      player.x += (player.targetX - player.x) * 0.25;

      if (player.isJumping) {
        player.jumpOffset += player.jumpSpeed;
        player.jumpSpeed -= 0.85;
        if (player.jumpOffset <= 0) { player.jumpOffset = 0; player.isJumping = false; }
      }

      if (player.isSliding) {
        player.slideTimer--;
        if (player.slideTimer <= 0) player.isSliding = false;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(140, 0); ctx.lineTo(140, 600);
      ctx.moveTo(260, 0); ctx.lineTo(260, 600);
      ctx.stroke();

      // Sprite Selection
      let currentImg = imgs.run;
      let drawW = player.width;
      let drawH = player.height;

      if (player.isJumping) currentImg = imgs.jump;
      if (player.isSliding) { currentImg = imgs.slide; drawH = 55; }

      ctx.drawImage(
        currentImg, 
        player.x - drawW / 2, 
        player.y - player.jumpOffset - drawH / 2, 
        drawW, 
        drawH
      );
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
