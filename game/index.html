<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HopePaw: Run for Hope</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #0d1b2a; font-family: Arial, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; }
    #game-container { position: relative; width: 100vw; max-width: 400px; height: 100vh; max-height: 700px; background: #1b263b; border: 2px solid #77abb7; border-radius: 16px; overflow: hidden; }
    #gameCanvas { display: block; width: 100%; height: 100%; }
    .ui { position: absolute; top: 18px; left: 18px; right: 18px; display: flex; justify-content: space-between; color: white; font-size: 19px; font-weight: bold; z-index: 10; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .controls { position: absolute; left: 0; bottom: 14px; width: 100%; padding: 0 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; z-index: 20; }
    .btn { background: rgba(255,255,255,0.20); color: white; border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; padding: 16px 2px; text-align: center; font-size: 14px; font-weight: bold; user-select: none; touch-action: manipulation; transition: transform 0.08s, background 0.08s; }
    .btn:active { background: rgba(255,255,255,0.40); transform: scale(0.96); }
    @media (max-width: 400px) {
      #game-container { width: 100vw; height: 100vh; max-width: none; max-height: none; border-radius: 0; }
      .ui { font-size: 18px; }
      .btn { font-size: 13px; padding: 15px 1px; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui">
      <div>SCORE: <span id="score">0</span></div>
      <div>DIST: <span id="dist">0</span>m</div>
    </div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="controls">
      <div class="btn" id="bL">◄ Kiri</div>
      <div class="btn" id="bJ">▲ Lompat</div>
      <div class="btn" id="bS">▼ Slide</div>
      <div class="btn" id="bR">Kanan ►</div>
    </div>
  </div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // MEMANGGIL GAMBAR DARI OUTSIDE FOLDER (ROOT)
  const sources = {
    idle: "../hopepaw-idle.png",
    run: "../hopepaw-run.png",
    jump: "../hopepaw-jump.png",
    slide: "../hopepaw-slide.png"
  };

  const images = {};
  let loadedCount = 0;
  const totalImages = Object.keys(sources).length;

  const player = {
    lane: 1,
    x: 200,
    y: 500,
    jump: 0,
    jumpPower: 0,
    sliding: false,
    dist: 0,
    score: 0
  };

  // PRELOAD GAMBAR DENGAN AMAN
  for (let key in sources) {
    images[key] = new Image();
    images[key].src = sources[key];
    images[key].onload = () => {
      loadedCount++;
      if (loadedCount === totalImages) {
        startGame();
      }
    };
  }

  function updatePlayerPosition() {
    if (player.lane === 0) player.x = 65;
    else if (player.lane === 1) player.x = 200;
    else player.x = 335;
  }

  function moveLeft() { if (player.lane > 0) { player.lane--; updatePlayerPosition(); } }
  function moveRight() { if (player.lane < 2) { player.lane++; updatePlayerPosition(); } }
  function jump() { if (player.jump === 0 && !player.sliding) { player.jump = 1; player.jumpPower = 18; } }
  function slide() { if (player.jump === 0) { player.sliding = true; setTimeout(() => { player.sliding = false; }, 600); } }

  // CONTROLS (TOUCH & CLICK & KEYBOARD)
  document.getElementById("bL").addEventListener("touchstart", (e) => { e.preventDefault(); moveLeft(); }, { passive: false });
  document.getElementById("bR").addEventListener("touchstart", (e) => { e.preventDefault(); moveRight(); }, { passive: false });
  document.getElementById("bJ").addEventListener("touchstart", (e) => { e.preventDefault(); jump(); }, { passive: false });
  document.getElementById("bS").addEventListener("touchstart", (e) => { e.preventDefault(); slide(); }, { passive: false });

  document.getElementById("bL").addEventListener("click", moveLeft);
  document.getElementById("bR").addEventListener("click", moveRight);
  document.getElementById("bJ").addEventListener("click", jump);
  document.getElementById("bS").addEventListener("click", slide);

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") moveLeft();
    if (e.key === "ArrowRight") moveRight();
    if (e.key === "ArrowUp" || e.key === " ") jump();
    if (e.key === "ArrowDown") slide();
  });

  // GAME LOOP UTAMA
  function startGame() {
    function loop() {
      ctx.clearRect(0, 0, 400, 600);

      if (player.jump > 0) {
        player.jumpPower -= 1;
        if (player.jumpPower <= -18) { player.jump = 0; player.jumpPower = 0; }
      }
      player.dist += 0.05;
      document.getElementById("dist").innerText = Math.floor(player.dist);
      document.getElementById("score").innerText = Math.floor(player.dist * 10);

      // JALUR / LANES
      ctx.strokeStyle = "rgba(255,255,255,0.1)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(133, 0); ctx.lineTo(133, 600);
      ctx.moveTo(266, 0); ctx.lineTo(266, 600);
      ctx.stroke();

      // DUA ANIMASI PERGANTIAN GAMBAR
      let img = images.run;
      if (player.jump > 0) img = images.jump;
      if (player.sliding) img = images.slide;

      let jumpH = (player.jump > 0) ? (18 * 18 - Math.pow(player.jumpPower, 2)) * 0.45 : 0;

      // GAMBAR MASKOT HOPEPAW
      ctx.drawImage(img, player.x - 50, player.y - jumpH - 50, 100, 100);

      requestAnimationFrame(loop);
    }
    loop();
  }
</script>
</body>
</html>
