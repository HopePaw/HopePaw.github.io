<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  >

  <title>HopePaw: Run for Hope</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #0d1b2a;

      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================
       GAME CONTAINER
    ========================= */

    #game-container {

      position: relative;

      width: 100vw;
      max-width: 400px;

      height: 100vh;
      max-height: 700px;

      background: #1b263b;

      border: 2px solid #77abb7;

      border-radius: 16px;

      overflow: hidden;
    }


    /* =========================
       CANVAS
    ========================= */

    #gameCanvas {

      display: block;

      width: 100%;
      height: 100%;
    }


    /* =========================
       TOP UI
    ========================= */

    .ui {

      position: absolute;

      top: 18px;
      left: 18px;
      right: 18px;

      display: flex;

      justify-content: space-between;

      color: white;

      font-size: 19px;

      font-weight: bold;

      z-index: 10;

      pointer-events: none;

      text-shadow:
        0 2px 4px rgba(0,0,0,0.5);
    }


    /* =========================
       CONTROLS
    ========================= */

    .controls {

      position: absolute;

      left: 0;
      bottom: 14px;

      width: 100%;

      padding: 0 10px;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 6px;

      z-index: 20;
    }


    .btn {

      background:
        rgba(255,255,255,0.20);

      color: white;

      border:
        1px solid
        rgba(255,255,255,0.10);

      border-radius: 10px;

      padding: 16px 2px;

      text-align: center;

      font-size: 14px;

      font-weight: bold;

      user-select: none;

      touch-action: manipulation;

      transition:
        transform 0.08s,
        background 0.08s;
    }


    .btn:active {

      background:
        rgba(255,255,255,0.40);

      transform: scale(0.96);
    }


    /* =========================
       SMALL PHONE
    ========================= */

    @media (max-width: 400px) {

      #game-container {

        width: 100vw;
        height: 100vh;

        max-width: none;
        max-height: none;

        border-radius: 0;
      }


      .ui {

        font-size: 18px;
      }


      .btn {

        font-size: 13px;

        padding:
          15px 1px;
      }
    }

  </style>
</head>


<body>


  <div id="game-container">


    <!-- =====================
         SCORE
    ====================== -->

    <div class="ui">

      <div>
        SCORE:
        <span id="score">0</span>
      </div>

      <div>
        DIST:
        <span id="dist">0</span>m
      </div>

    </div>


    <!-- =====================
         GAME CANVAS
    ====================== -->

    <canvas
      id="gameCanvas"
      width="400"
      height="600"
    ></canvas>


    <!-- =====================
         CONTROLS
    ====================== -->

    <div class="controls">

      <div
        class="btn"
        id="bL"
      >
        ◄ Kiri
      </div>


      <div
        class="btn"
        id="bJ"
      >
        ▲ Lompat
      </div>


      <div
        class="btn"
        id="bS"
      >
        ▼ Slide
      </div>


      <div
        class="btn"
        id="bR"
      >
        Kanan ►
      </div>

    </div>

  </div>



<script>

  /* =====================================================
     CANVAS
  ===================================================== */

  const canvas =
    document.getElementById("gameCanvas");

  const ctx =
    canvas.getContext("2d");


  /* =====================================================
     HOPEPAW IMAGES
     
     SEMUA FILE BERADA DI FOLDER YANG SAMA
     DENGAN index.html
     
     game/
       index.html
       hopepaw-idle.png
       hopepaw-run.png
       hopepaw-jump.png
       hopepaw-slide.png
  ===================================================== */

  const images = {

    idle: new Image(),

    run: new Image(),

    jump: new Image(),

    slide: new Image()

  };


  images.idle.src =
    "hopepaw-idle.png";

  images.run.src =
    "hopepaw-run.png";

  images.jump.src =
    "hopepaw-jump.png";

  images.slide.src =
    "hopepaw-slide.png";


  /* =====================================================
     CHECK IMAGE
  ===================================================== */

  images.idle.onload = function() {

    console.log(
      "✅ HopePaw idle loaded"
    );

  };


  images.run.onload = function() {

    console.log(
      "✅ HopePaw run loaded"
    );

  };


  images.jump.onload = function() {

    console.log(
      "✅ HopePaw jump loaded"
    );

  };


  images.slide.onload = function() {

    console.log(
      "✅ HopePaw slide loaded"
    );

  };


  images.idle.onerror = function() {

    console.error(
      "❌ hopepaw-idle.png tidak ditemukan"
    );

  };


  images.run.onerror = function() {

    console.error(
      "❌ hopepaw-run.png tidak ditemukan"
    );

  };


  images.jump.onerror = function() {

    console.error(
      "❌ hopepaw-jump.png tidak ditemukan"
    );

  };


  images.slide.onerror = function() {

    console.error(
      "❌ hopepaw-slide.png tidak ditemukan"
    );

  };


  /* =====================================================
     PLAYER
  ===================================================== */

  const player = {

    lane: 1,

    x: 200,

    y: 500,

    jump: 0,

    jumpPower: 0,

    sliding: false,

    dist: 0,

    score: 0

  };


  /* =====================================================
     LANE POSITION
  ===================================================== */

  function updatePlayerPosition() {

    if (player.lane === 0) {

      player.x = 65;

    }

    else if (player.lane === 1) {

      player.x = 200;

    }

    else {

      player.x = 335;

    }

  }


  /* =====================================================
     MOVE LEFT
  ===================================================== */

  function moveLeft() {

    if (player.lane > 0) {

      player.lane--;

      updatePlayerPosition();

    }

  }


  /* =====================================================
     MOVE RIGHT
  ===================================================== */

  function moveRight() {

    if (player.lane < 2) {

      player.lane++;

      updatePlayerPosition();

    }

  }


  /* =====================================================
     JUMP
  ===================================================== */

  function jump() {

    if (
      player.jump === 0 &&
      !player.sliding
    ) {

      player.jump = 1;

      player.jumpPower = 18;

    }

  }


  /* =====================================================
     SLIDE
  ===================================================== */

  function slide() {

    if (player.jump === 0) {

      player.sliding = true;


      setTimeout(
        function() {

          player.sliding = false;

        },
        600
      );

    }

  }


  /* =====================================================
     TOUCH CONTROLS
  ===================================================== */

  document
    .getElementById("bL")
    .addEventListener(
      "touchstart",
      function(e) {

        e.preventDefault();

        moveLeft();

      },
      { passive: false }
    );


  document
    .getElementById("bR")
    .addEventListener(
      "touchstart",
      function(e) {

        e.preventDefault();

        moveRight();

      },
      { passive: false }
    );


  document
    .getElementById("bJ")
    .addEventListener(
      "touchstart",
      function(e) {

        e.preventDefault();

        jump();

      },
      { passive: false }
    );


  document
    .getElementById("bS")
    .addEventListener(
      "touchstart",
      function(e) {

        e.preventDefault();

        slide();

      },
      { passive: false }
    );


  /* =====================================================
     MOUSE SUPPORT
  ===================================================== */

  document
    .getElementById("bL")
    .addEventListener(
      "click",
      moveLeft
    );


  document
    .getElementById("bR")
    .addEventListener(
      "click",
      moveRight
    );


  document
    .getElementById("bJ")
    .addEventListener(
      "click",
      jump
    );


  document
    .getElementById("bS")
    .addEventListener(
      "click",
      slide
    );


  /* =====================================================
     KEYBOARD SUPPORT
  ===================================================== */

  document.addEventListener(
    "keydown",
    function(e) {

      if (
        e.key === "ArrowLeft"
      ) {

        moveLeft();

      }


      if (
        e.key === "ArrowRight"
      ) {

        moveRight();

      }


      if (
        e.key === "ArrowUp" ||
        e.key === " "
      ) {

        jump();

      }


      if (
        e.key === "ArrowDown"
      ) {
