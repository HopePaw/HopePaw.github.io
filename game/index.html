 <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HopePaw: Run for Hope</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #0d1b2a; font-family: Arial, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; }
    #game-container { position: relative; width: 100vw; max-width: 400px; height: 100vh; max-height: 600px; background: #1c2541; border-radius: 12px; overflow: hidden; }
    #gameCanvas { display: block; width: 100%; height: 100%; }
    .ui { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; color: white; font-size: 16px; font-weight: bold; z-index: 10; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .tap-hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.7); font-size: 14px; font-weight: bold; pointer-events: none; }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui">
      <div>PAW COINS: <span id="coins" style="color: #48cae4;">0</span></div>
      <div>DIST: <span id="dist">0</span>m</div>
    </div>
    <div class="tap-hint">TAP LAYAR UNTUK LOMPAT 🐾</div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
  </div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  let gameOver = false;
  let gameSpeed = 3.5;
  let tick = 0;
  let groundY = 480;

  const player = { x: 70, y: groundY - 30, vy: 0, gravity: 0.65, jumpPower: -11.5, isGrounded: true, coins: 0, dist: 0 };

  let obstacles = [];
  let coinItems = [];
  let bgTrees = [];

  for (let i = 0; i < 5; i++) {
    bgTrees.push({ x: i * 100, size: 20 + Math.random() * 15 });
  }

  function jump() {
    if (gameOver) { resetGame(); return; }
    if (player.isGrounded) {
      player.vy = player.jumpPower;
      player.isGrounded = false;
    }
  }

  function resetGame() {
    gameOver = false; gameSpeed = 3.5; player.y = groundY - 30; player.vy = 0;
    player.isGrounded = true; player.coins = 0; player.dist = 0;
    obstacles = []; coinItems = [];
    document.getElementById("coins").innerText = "0";
    loop();
  }

  window.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); }, { passive: false });
  window.addEventListener("mousedown", jump);

  // MENGGAMBAR HOPEPAW 2D DARI SAMPING
  function drawHopePaw2D(x, y) {
    ctx.save();
    ctx.translate(x, y);

    let legCycle = Math.sin(tick * 0.25) * 8;
    let tailWag = Math.sin(tick * 0.3) * 6;

    // Bayangan di tanah
    if (player.isGrounded) {
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.beginPath(); ctx.ellipse(0, 26, 18, 5, 0, 0, Math.PI * 2); ctx.fill();
    }

    // Ekor
    ctx.strokeStyle = "#D48C18"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-18, 0); ctx.quadraticCurveTo(-26, -8 + tailWag, -28, -14); ctx.stroke();

    // Kaki Belakang & Depan
    ctx.strokeStyle = "#D48C18"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-8, 10); ctx.lineTo(-8 - legCycle, 22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, 10); ctx.lineTo(8 + legCycle, 22); ctx.stroke();

    // Badan Emas (Golden Retriever)
    ctx.fillStyle = "#F3A723";
    ctx.beginPath(); ctx.ellipse(0, 2, 20, 14, 0, 0, Math.PI * 2); ctx.fill();

    // Bandana Biru Segitiga
    ctx.fillStyle = "#0077B6";
    ctx.beginPath(); ctx.moveTo(4, -4); ctx.lineTo(16, 2); ctx.lineTo(8, 12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#FFF"; ctx.beginPath(); ctx.arc(9, 4, 2, 0, Math.PI * 2); ctx.fill(); // Paw

    // Kepala
    ctx.fillStyle = "#F3A723";
    ctx.beginPath(); ctx.arc(12, -12, 14, 0, Math.PI * 2); ctx.fill();

    // Moncong
    ctx.fillStyle = "#FFE8B6";
    ctx.beginPath(); ctx.ellipse(18, -8, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(22, -10, 2.5, 0, Math.PI * 2); ctx.fill(); // Hidung

    // Mata
    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(14, -15, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#FFF"; ctx.beginPath(); ctx.arc(13, -16, 1, 0, Math.PI * 2); ctx.fill();

    // Telinga Floppy
    ctx.fillStyle = "#D48C18";
    ctx.beginPath(); ctx.ellipse(4, -12, 5, 11, Math.PI / 6, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  function loop() {
    tick++;
    ctx.clearRect(0, 0, 400, 600);

    // Langit
    ctx.fillStyle = "#1c2541"; ctx.fillRect(0, 0, 400, 600);

    // Pohon Background Parallax
    bgTrees.forEach(t => {
      t.x -= gameSpeed * 0.3;
      if (t.x < -30) t.x = 430;
      ctx.fillStyle = "#0b2545";
      ctx.beginPath(); ctx.arc(t.x, groundY - t.size, t.size, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(t.x - 3, groundY - t.size, 6, t.size);
    });

    // Tanah
    ctx.fillStyle = "#3a5a40"; ctx.fillRect(0, groundY, 400, 120);
    ctx.fillStyle = "#48cae4"; ctx.fillRect(0, groundY, 400, 4); // Line Atas

    // Spawning Rintangan (Kardus Kayu)
    if (Math.random() < 0.015) {
      if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < 220) {
        obstacles.push({ x: 420, y: groundY - 25, w: 25, h: 25 });
      }
    }

    // Spawning Koin Paw
    if (Math.random() < 0.025) {
      if (coinItems.length === 0 || coinItems[coinItems.length - 1].x < 180) {
        coinItems.push({ x: 420, y: groundY - 60 - Math.random() * 40 });
      }
    }

    // Update & Draw Koin
    for (let i = coinItems.length - 1; i >= 0; i--) {
      let c = coinItems[i]; c.x -= gameSpeed;
      ctx.fillStyle = "#0096C7"; ctx.beginPath(); ctx.arc(c.x, c.y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#48CAE4"; ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#FFF"; ctx.beginPath(); ctx.arc(c.x, c.y + 1, 2.5, 0, Math.PI * 2); ctx.fill();

      // Cek Ambil Koin
      if (Math.hypot(player.x - c.x, player.y - c.y) < 25) {
        player.coins += 1;
        document.getElementById("coins").innerText = player.coins;
        coinItems.splice(i, 1);
      } else if (c.x < -20) coinItems.splice(i, 1);
    }

    // Update & Draw Rintangan
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let o = obstacles[i]; o.x -= gameSpeed;
      ctx.fillStyle = "#8D6E63"; ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = "#4E342E"; ctx.lineWidth = 2; ctx.strokeRect(o.x, o.y, o.w, o.h);

      // Cek Tabrakan
      if (player.x + 12 > o.x && player.x - 12 < o.x + o.w && player.y + 15 > o.y) {
        gameOver = true;
      }
      if (o.x < -30) obstacles.splice(i, 1);
    }

    // Fisika Player
    if (!gameOver) {
      player.vy += player.gravity;
      player.y += player.vy;

      if (player.y >= groundY - 22) {
        player.y = groundY - 22;
        player.vy = 0;
        player.isGrounded = true;
      }

      player.dist += 0.08;
      gameSpeed = 3.5 + Math.floor(player.dist / 40) * 0.3;
      document.getElementById("dist").innerText = Math.floor(player.dist);
    }

    drawHopePaw2D(player.x, player.y);

    // Layar Game Over
    if (gameOver) {
      ctx.fillStyle = "rgba(13, 27, 42, 0.85)"; ctx.fillRect(0, 0, 400, 600);
      ctx.fillStyle = "#FF5252"; ctx.font = "bold 26px Arial"; ctx.textAlign = "center";
      ctx.fillText("GAME OVER", 200, 250);
      ctx.fillStyle = "#FFF"; ctx.font = "15px Arial";
      ctx.fillText("Jarak: " + Math.floor(player.dist) + "m | Paw Coins: " + player.coins, 200, 290);
      ctx.fillStyle = "#48CAE4"; ctx.font = "bold 15px Arial";
      ctx.fillText("Ketuk Layar untuk Main Lagi 🐾", 200, 350);
      return;
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
