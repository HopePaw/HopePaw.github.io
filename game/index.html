<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HopePaw: Run for Hope</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #0b132b; font-family: Arial, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; }
    #game-container { position: relative; width: 100vw; max-width: 400px; height: 100vh; max-height: 600px; aspect-ratio: 2/3; background: #1c2541; border: 2px solid #48cae4; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #gameCanvas { display: block; width: 100%; height: 100%; }
    .ui { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; color: white; font-size: 15px; font-weight: bold; z-index: 10; pointer-events: none; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    .controls { position: absolute; left: 0; bottom: 12px; width: 100%; padding: 0 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; z-index: 20; }
    .btn { background: rgba(255,255,255,0.22); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 14px 2px; text-align: center; font-size: 13px; font-weight: bold; user-select: none; touch-action: manipulation; transition: transform 0.08s, background 0.08s; }
    .btn:active { background: rgba(255,255,255,0.45); transform: scale(0.95); }
    @media (max-width: 400px) {
      #game-container { border-radius: 0; border: none; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui">
      <div>PAW COINS: <span id="coins" style="color: #48cae4;">0</span></div>
      <div>DIST: <span id="dist">0</span>m</div>
    </div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="controls">
      <div class="btn" id="bL">◄ Kiri</div>
      <div class="btn" id="bJ">▲ Lompat</div>
      <div class="btn" id="bS">▼ Slide</div>
      <div class="btn" id="bR">Kanan ►</div>
    </div>
  </div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  let gameOver = false;
  let gameSpeed = 5;
  let roadOffset = 0;
  let tick = 0;

  const player = { lane: 1, x: 200, y: 480, jump: 0, jumpPower: 0, sliding: false, dist: 0, coins: 0 };
  
  // Fungsi Helper Perspektif Jalan (Trapezoid Projection)
  function getPerspectiveX(lane, y) {
    let progress = y / 600; // 0 di horizon, 1 di bawah
    let topCenter = 200;
    let topWidth = 120;
    let bottomWidth = 360;
    
    let currentWidth = topWidth + (bottomWidth - topWidth) * progress;
    let leftEdge = topCenter - currentWidth / 2;
    let laneWidth = currentWidth / 3;
    
    return leftEdge + laneWidth * (lane + 0.5);
  }

  let trees = [];
  let obstacles = [];
  let coinItems = [];
  let clouds = [
    { x: 50, y: 40, speed: 0.3, size: 25 },
    { x: 250, y: 70, speed: 0.5, size: 35 },
    { x: 340, y: 30, speed: 0.2, size: 20 }
  ];

  for (let i = 0; i < 8; i++) {
    trees.push({ y: i * 80, side: i % 2 === 0 ? 'left' : 'right' });
  }

  function moveLeft() { if (!gameOver && player.lane > 0) player.lane--; }
  function moveRight() { if (!gameOver && player.lane < 2) player.lane++; }
  function jump() { if (!gameOver && player.jump === 0 && !player.sliding) { player.jump = 1; player.jumpPower = 17; } }
  function slide() { if (!gameOver && player.jump === 0) { player.sliding = true; setTimeout(() => { player.sliding = false; }, 650); } }

  function resetGame() {
    gameOver = false; gameSpeed = 5; player.lane = 1; player.dist = 0; player.coins = 0;
    player.jump = 0; player.sliding = false; obstacles = []; coinItems = [];
    document.getElementById("coins").innerText = "0";
    loop();
  }

  document.getElementById("bL").addEventListener("click", moveLeft);
  document.getElementById("bR").addEventListener("click", moveRight);
  document.getElementById("bJ").addEventListener("click", jump);
  document.getElementById("bS").addEventListener("click", slide);
  canvas.addEventListener("click", () => { if (gameOver) resetGame(); });

  // 1. DETAIL MASCOT HOPEPAW
  function drawHopePaw(x, y, isSliding, jumpH) {
    ctx.save();
    ctx.translate(x, y - jumpH);

    let runCycle = Math.sin(tick * 0.3) * 6;
    let tailWag = Math.sin(tick * 0.4) * 8;

    // Bayangan
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(0, jumpH + 28, isSliding ? 35 : 22, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    if (isSliding) {
      // Ekor
      ctx.strokeStyle = "#D48C18"; ctx.lineWidth = 6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-25, 10); ctx.quadraticCurveTo(-35, 10 + tailWag, -40, 5); ctx.stroke();
      
      // Badan Slide
      ctx.fillStyle = "#F3A723"; ctx.beginPath(); ctx.ellipse(0, 10, 34, 15, 0, 0, Math.PI * 2); ctx.fill();
      
      // Bandana Biru Segitiga
      ctx.fillStyle = "#0077B6"; ctx.beginPath(); ctx.moveTo(5, -2); ctx.lineTo(25, 12); ctx.lineTo(12, 22); ctx.closePath(); ctx.fill();
      
      // Kepala
      ctx.fillStyle = "#F3A723"; ctx.beginPath(); ctx.arc(20, -2, 18, 0, Math.PI * 2); ctx.fill();
      
      // Moncong & Hidung
      ctx.fillStyle = "#FFE8B6"; ctx.beginPath(); ctx.ellipse(28, 2, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#222222"; ctx.beginPath(); ctx.arc(32, 0, 3, 0, Math.PI * 2); ctx.fill();
      
      // Telinga Floppy
      ctx.fillStyle = "#D48C18"; ctx.beginPath(); ctx.ellipse(12, -8, 6, 12, Math.PI/4, 0, Math.PI * 2); ctx.fill();
    } else {
      // Ekor Bergoyang
      ctx.strokeStyle = "#D48C18"; ctx.lineWidth = 7; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-15, 8); ctx.quadraticCurveTo(-25, -5 + tailWag, -30, -12); ctx.stroke();

      // Kaki Belakang
      ctx.fillStyle = "#D48C18";
      ctx.beginPath(); ctx.arc(-12 + runCycle, 20, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(12 - runCycle, 20, 6, 0, Math.PI * 2); ctx.fill();

      // Badan Utama (Golden Retriever)
      ctx.fillStyle = "#F3A723";
      ctx.beginPath(); ctx.ellipse(0, 8, 22, 18, 0, 0, Math.PI * 2); ctx.fill();

      // Bandana Biru Segitiga + Paw Putih
      ctx.fillStyle = "#0077B6";
      ctx.beginPath(); ctx.moveTo(-16, -2); ctx.lineTo(16, -2); ctx.lineTo(0, 18); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#FFFFFF"; // Paw Logo
      ctx.beginPath(); ctx.arc(0, 5, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-3, 2, 1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(3, 2, 1, 0, Math.PI * 2); ctx.fill();

      // Kepala
      ctx.fillStyle = "#F3A723";
      ctx.beginPath(); ctx.arc(0, -16, 20, 0, Math.PI * 2); ctx.fill();

      // Moncong
      ctx.fillStyle = "#FFE8B6";
      ctx.beginPath(); ctx.ellipse(0, -10, 9, 7, 0, 0, Math.PI * 2); ctx.fill();

      // Hidung & Mata Besar Berkilau
      ctx.fillStyle = "#222222";
      ctx.beginPath(); ctx.ellipse(0, -13, 4, 3, 0, 0, Math.PI * 2); ctx.fill(); // Hidung
      
      ctx.beginPath(); ctx.arc(-8, -20, 3.5, 0, Math.PI * 2); ctx.fill(); // Mata Kiri
      ctx.beginPath(); ctx.arc(8, -20, 3.5, 0, Math.PI * 2); ctx.fill();  // Mata Kanan
      
      ctx.fillStyle = "#FFFFFF"; // Highlight Mata
      ctx.beginPath(); ctx.arc(-9, -21, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(7, -21, 1.2, 0, Math.PI * 2); ctx.fill();

      // Telinga Floppy Kiri & Kanan
      ctx.fillStyle = "#D48C18";
      ctx.beginPath(); ctx.ellipse(-20, -16, 7, 15, Math.PI / 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(20, -16, 7, 15, -Math.PI / 8, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
  }

  // 2. POHON BERLAPIS & RINCI
  function drawTree(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Batang
    ctx.fillStyle = "#4A2E18"; ctx.fillRect(-5, 0, 10, 20);

    // 3 Lapis Daun (Gradient Feel)
    ctx.fillStyle = "#1B4332"; ctx.beginPath(); ctx.arc(0, -10, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2D6A4F"; ctx.beginPath(); ctx.arc(0, -20, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#40916C"; ctx.beginPath(); ctx.arc(-4, -25, 11, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  // 3. KOIN PAW BERKILAU (ANIMATED ROTATION)
  function drawCoin(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    
    let spinScale = Math.cos(tick * 0.1); // Efek Putar Pipih
    ctx.scale(spinScale * scale, scale);

    // Coin Outer
    ctx.fillStyle = "#0096C7"; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#48CAE4"; ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();

    // Paw Design
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath(); ctx.arc(0, 2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-4, -3, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -3, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -5, 2, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  // 4. RINTANGAN BER-TEMA
  function drawObstacle(obs, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    if (obs.type === 'low') {
      // Tumpukan Kardus / Kayu (Jump)
      ctx.fillStyle = "#9A7B56"; ctx.fillRect(-28, -20, 56, 22);
      ctx.fillStyle = "#7F5A37"; ctx.fillRect(-28, -20, 56, 4);
      ctx.strokeStyle = "#5C3D1E"; ctx.lineWidth = 2; ctx.strokeRect(-28, -20, 56, 22);
      ctx.fillStyle = "#FFF"; ctx.font = "bold 10px Arial"; ctx.fillText("📦 DANGER", -24, -6);
    } else {
      // Barikade Gantung (Slide)
      ctx.fillStyle = "#333"; ctx.fillRect(-32, -65, 6, 65); ctx.fillRect(26, -65, 6, 65);
      ctx.fillStyle = "#E63946"; ctx.fillRect(-30, -55, 60, 24);
      ctx.fillStyle = "#FFF"; ctx.font = "bold 11px Arial"; ctx.fillText("▼ SLIDE ▼", -22, -39);
    }
    ctx.restore();
  }

  // GAME LOOP UTAMA
  function loop() {
    tick++;
    ctx.clearRect(0, 0, 400, 600);

    // Background Langit & Kabut
    let skyGradient = ctx.createLinearGradient(0, 0, 0, 200);
    skyGradient.addColorStop(0, "#0b132b");
    skyGradient.addColorStop(1, "#1c2541");
    ctx.fillStyle = skyGradient; ctx.fillRect(0, 0, 400, 200);

    // Awan
    clouds.forEach(c => {
      c.x += c.speed; if (c.x > 430) c.x = -30;
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.beginPath(); ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2); ctx.arc(c.x + 15, c.y - 5, c.size * 0.8, 0, Math.PI * 2); ctx.fill();
    });

    // 1. Gambar Jalan Perspective (Trapezoid)
    ctx.fillStyle = "#3a5a40"; ctx.fillRect(0, 150, 400, 450); // Rumput Samping

    ctx.beginPath();
    ctx.moveTo(140, 150);
    ctx.lineTo(260, 150);
    ctx.lineTo(380, 600);
    ctx.lineTo(20, 600);
    ctx.closePath();
    ctx.fillStyle = "#2b2d42"; ctx.fill(); // Jalanan Utama

    // Pinggir Jalan (Borders)
    ctx.strokeStyle = "#48cae4"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(140, 150); ctx.lineTo(20, 600); ctx.moveTo(260, 150); ctx.lineTo(380, 600); ctx.stroke();

    // Garis Jalur Putus-Putus
    roadOffset = (roadOffset + gameSpeed) % 40;
    ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 2; ctx.setLineDash([15, 15]); ctx.lineDashOffset = -roadOffset;
    ctx.beginPath();
    ctx.moveTo(180, 150); ctx.lineTo(140, 600);
    ctx.moveTo(220, 150); ctx.lineTo(260, 600);
    ctx.stroke(); ctx.setLineDash([]);

    // 2. Pohon Perspektif
    trees.forEach(tree => {
      tree.y += gameSpeed; if (tree.y > 600) tree.y = 150;
      let progress = (tree.y - 150) / 450;
      let scale = 0.4 + progress * 0.8;
      let x = tree.side === 'left' ? (120 - progress * 100) : (280 + progress * 100);
      drawTree(x, tree.y, scale);
    });

    // 3. Spawning System
    if (Math.random() < 0.02) {
      let laneIdx = Math.floor(Math.random() * 3);
      if (obstacles.length === 0 || obstacles[obstacles.length - 1].y > 280) {
        obstacles.push({ lane: laneIdx, y: 150, type: Math.random() > 0.5 ? 'low' : 'high' });
      }
    }
    if (Math.random() < 0.035) {
      let laneIdx = Math.floor(Math.random() * 3);
      if (coinItems.length === 0 || coinItems[coinItems.length - 1].y > 220) {
        coinItems.push({ lane: laneIdx, y: 150 });
      }
    }

    // 4. Render & Update Koin
    for (let i = coinItems.length - 1; i >= 0; i--) {
      let coin = coinItems[i]; coin.y += gameSpeed;
      let progress = (coin.y - 150) / 450;
      let scale = 0.3 + progress * 0.7;
      let x = getPerspectiveX(coin.lane, coin.y);

      drawCoin(x, coin.y, scale);

      if (Math.abs(coin.y - player.y) < 25 && coin.lane === player.lane && player.jump === 0) {
        player.coins += 1;
        document.getElementById("coins").innerText = player.coins;
        coinItems.splice(i, 1);
      } else if (coin.y > 610) coinItems.splice(i, 1);
    }

    // 5. Render & Update Rintangan
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i]; obs.y += gameSpeed;
      let progress = (obs.y - 150) / 450;
      let scale = 0.4 + progress * 0.8;
      let x = getPerspectiveX(obs.lane, obs.y);

      drawObstacle(obs, x, obs.y, scale);

      if (Math.abs(obs.y - player.y) < 20 && obs.lane === player.lane) {
        if (obs.type === 'low' && player.jump === 0) gameOver = true;
        else if (obs.type === 'high' && !player.sliding) gameOver = true;
      }
      if (obs.y > 630) obstacles.splice(i, 1);
    }

    // 6. Fisika & Render Player
    if (!gameOver) {
      if (player.jump > 0) {
        player.jumpPower -= 1;
        if (player.jumpPower <= -17) { player.jump = 0; player.jumpPower = 0; }
      }
      player.dist += 0.1;
      gameSpeed = 5 + Math.floor(player.dist / 50) * 0.4;
      document.getElementById("dist").innerText = Math.floor(player.dist);
    }

    let targetX = getPerspectiveX(player.lane, player.y);
    player.x += (targetX - player.x) * 0.25; // Smooth Lane Change Interpolation

    let jumpH = (player.jump > 0) ? (17 * 17 - Math.pow(player.jumpPower, 2)) * 0.4 : 0;
    drawHopePaw(player.x, player.y, player.sliding, jumpH);

    // 7. Game Over Screen
    if (gameOver) {
      ctx.fillStyle = "rgba(11, 19, 43, 0.88)"; ctx.fillRect(0, 0, 400, 600);
      ctx.fillStyle = "#FF5252"; ctx.font = "bold 26px Arial"; ctx.textAlign = "center";
      ctx.fillText("GAME OVER", 200, 240);
      ctx.fillStyle = "#FFF"; ctx.font = "15px Arial";
      ctx.fillText("Jarak: " + Math.floor(player.dist) + "m  |  Paw Coins: " + player.coins, 200, 280);
      ctx.fillStyle = "#48CAE4"; ctx.font = "bold 15px Arial";
      ctx.fillText("Ketuk Layar untuk Main Lagi 🐾", 200, 340);
      return;
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
