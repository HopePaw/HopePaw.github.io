<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>HopePaw Quotes — Words to Inspire 🐾</title>
  <meta name="description" content="Words to inspire. Remind. Heal. Hope. Explore quotes from the HopePaw world. 🐾💙">

  <style>
    :root {
      --bg-color: #020617;
      --card-bg: #0f172a;
      --accent-color: #38bdf8;
      --blue-light: #60a5fa;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(96, 165, 250, 0.22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at 20% 10%, rgba(37,99,235,.22), transparent 30%),
                  radial-gradient(circle at 80% 30%, rgba(56,189,248,.12), transparent 28%),
                  linear-gradient(135deg, #020617, #07152f 55%, #020617);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: min(100%, 1100px);
      padding: 18px;
    }

    /* TOP NAVIGATION BAR */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid var(--border-color);
      color: var(--blue-light);
      padding: 8px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: rgba(37, 99, 235, 0.3);
      border-color: var(--blue-light);
      color: #ffffff;
      transform: translateY(-2px);
    }

    header {
      text-align: center;
      padding: 10px 20px 30px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 42px);
      color: var(--accent-color);
      font-weight: 800;
    }

    header p {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .quotes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      width: 100%;
      padding-bottom: 40px;
    }

    .quote-card {
      position: relative;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .quote-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(56, 189, 248, 0.25);
      border-color: rgba(96, 165, 250, 0.6);
    }

    .image-container {
      position: relative;
      width: 100%;
      padding-top: 100%; /* Aspect ratio 1:1 */
    }

    .image-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(2,6,23,0.3) 0%, rgba(2,6,23,0.15) 35%, rgba(2,6,23,0.92) 100%);
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .theme-badge {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border-color);
      color: var(--blue-light);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .quote-text-box {
      margin-top: auto;
    }

    .quote-text {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .quote-author {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 20px 0 40px;
    }

    footer strong {
      color: var(--blue-light);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- NAVIGATION BAR -->
    <div class="nav-bar">
      <a href="index.html" class="btn-back">
        ← Back to Main Website
      </a>
    </div>

    <header>
      <h1>HopePaw Quotes 🐾💙</h1>
      <p>Words to inspire. Remind. Heal. Hope.</p>
    </header>

    <main class="quotes-grid" id="quotesContainer">
      <!-- Kartu Quotes dimuat otomatis via JSON -->
    </main>

    <footer>
      <strong>HopePaw Quotes</strong> · A Meme With A Mission 🐾💙
    </footer>
  </div>

  <script>
    fetch('wall-of-hope-data.json')
      .then(response => {
        if (!response.ok) throw new Error("Gagal mengambil data JSON");
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('quotesContainer');
        container.innerHTML = ""; // Bersihkan kontainer

        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'quote-card';

          card.innerHTML = `
            <div class="image-container">
              <img src="${item.image}" alt="${item.theme}" loading="lazy" />
              <div class="overlay-content">
                <span class="theme-badge">#${item.id} ${item.theme}</span>
                <div class="quote-text-box">
                  <div class="quote-text">“${item.quote}”</div>
                  <div class="quote-author">— ${item.author}</div>
                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(error => {
        console.error('Error loading data:', error);
        document.getElementById('quotesContainer').innerHTML = `
          <div style="text-align:center; grid-column: 1/-1; padding: 40px; color: var(--text-muted);">
            <p>Gagal memuat kutipan. Pastikan file <code>wall-of-hope-data.json</code> tersedia di folder yang sama.</p>
          </div>
        `;
      });
  </script>

</body>
</html>
