<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HopePaw Quotes — Words to Inspire</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --accent-color: #48cae4;
      --text-main: #ffffff;
      --twitter-blue: #1d9bf0;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      color: var(--accent-color);
    }

    header p {
      margin-top: 8px;
      color: #a5b4fc;
      font-size: 1rem;
    }

    .quotes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      width: 90%;
      max-width: 1100px;
      padding: 20px 0 60px;
    }

    .quote-card {
      position: relative;
      background-color: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .quote-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(72, 202, 228, 0.3);
    }

    .image-container {
      position: relative;
      width: 100%;
      padding-top: 100%; /* Aspect ratio 1:1 */
    }

    .image-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.85) 100%);
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .theme-badge {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .quote-text-box {
      margin-top: auto;
    }

    .quote-text {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    .quote-author {
      font-size: 0.85rem;
      color: #e0e1dd;
      font-style: italic;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      margin-bottom: 12px;
    }

    .share-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(29, 155, 240, 0.2);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #ffffff;
      border: 1px solid rgba(29, 155, 240, 0.5);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      width: fit-content;
    }

    .share-btn:hover {
      background-color: var(--twitter-blue);
      border-color: var(--twitter-blue);
      box-shadow: 0 0 12px rgba(29, 155, 240, 0.6);
      transform: translateY(-2px);
    }

    .share-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <header>
    <h1>HopePaw Quotes 🐾💙</h1>
    <p>Words to inspire. Remind. Heal. Hope.</p>
  </header>

  <main class="quotes-grid" id="quotesContainer">
    <!-- Kartu Quotes dimuat otomatis via JS -->
  </main>

  <script>
    // Fungsi untuk membuka jendela Tweet otomatis
    function shareToX(quote, author) {
      const websiteUrl = window.location.href;
      const text = `"${quote}" — ${author}\n\nInspired by HopePaw Quotes 🐾💙\n`;
      const hashtags = "HopePaw,Quotes,Crypto";
      
      const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(websiteUrl)}&hashtags=${hashtags}`;
      window.open(twitterUrl, '_blank', 'width=600,height=400');
    }

    // Mengambil data dari JSON
    fetch('wall-of-hope-data.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('quotesContainer');
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'quote-card';
          
          // Escape karakter petik tunggal agar JS tidak error
          const safeQuote = item.quote.replace(/'/g, "\\'");
          const safeAuthor = item.author.replace(/'/g, "\\'");

          card.innerHTML = `
            <div class="image-container">
              <img src="${item.image}" alt="${item.theme}" loading="lazy" />
              <div class="overlay-content">
                <span class="theme-badge">#${item.id} ${item.theme}</span>
                <div class="quote-text-box">
                  <div class="quote-text">“${item.quote}”</div>
                  <div class="quote-author">— ${item.author}</div>
                  <button onclick="shareToX('${safeQuote}', '${safeAuthor}')" class="share-btn">
                    <svg viewBox="0 0 24 24">
                      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                    Share to X
                  </button>
                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(error => console.error('Error loading data:', error));
  </script>

</body>
</html>
