<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tug of War - 2 Player Math Battle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-wrapper {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 2px solid #334155;
        }
        .header {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: #0f172a;
            font-weight: bold;
            font-size: 15px;
            border-bottom: 2px solid #334155;
        }
        .p1-title { color: #38bdf8; }
        .p2-title { color: #f43f5e; }

        /* Arena Emoji */
        .arena {
            position: relative;
            width: 100%;
            height: 140px;
            background: linear-gradient(to bottom, #38bdf8 0%, #bae6fd 60%, #4ade80 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 2px solid #334155;
        }
        .tug-container {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease-out;
            width: 100%;
        }
        .character {
            font-size: 45px;
            user-select: none;
        }
        .rope-line {
            width: 120px;
            height: 6px;
            background: #b45309;
            margin: 0 -5px;
            position: relative;
            z-index: 1;
        }
        .flag {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid #ef4444;
            z-index: 2;
        }

        /* Bagian Soal & Tombol Pemain */
        .battle-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #1e293b;
        }
        .player-panel {
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .p1-panel { border-right: 2px solid #334155; background: rgba(56, 189, 248, 0.05); }
        .p2-panel { background: rgba(244, 63, 94, 0.05); }

        .question-box {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #f8fafc;
            height: 30px;
            display: flex;
            align-items: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }
        .btn-opt {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-opt:active {
            transform: scale(0.95);
        }
        .p1-panel .btn-opt:hover { background: #0284c7; }
        .p2-panel .btn-opt:hover { background: #e11d48; }

        .info-footer {
            padding: 12px;
            text-align: center;
            font-size: 14px;
            background: #0f172a;
            font-weight: bold;
            color: #94a3b8;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <span class="p1-title">🧍‍♂️ P1 (Kiri)</span>
            <span id="game-status">Adu Cepat Jawab!</span>
            <span class="p2-title">P2 (Kanan) 🧍‍♀️</span>
        </div>

        <!-- Arena Tarik Tambang Emoji -->
        <div class="arena">
            <div class="tug-container" id="tugContainer" style="transform: translateX(0px);">
                <span class="character">🧍‍♂️</span>
                <div class="rope-line"></div>
                <div style="position:relative;">
                    <div class="flag"></div>
                </div>
                <div class="rope-line"></div>
                <span class="character">🧍‍♀️</span>
            </div>
        </div>

        <!-- Panel Kontrol 2 Pemain -->
        <div class="battle-section">
            <!-- Panel Pemain 1 -->
            <div class="player-panel p1-panel">
                <div class="question-box" id="p1-q">--</div>
                <div class="options-grid" id="p1-options"></div>
            </div>

            <!-- Panel Pemain 2 -->
            <div class="player-panel p2-panel">
                <div class="question-box" id="p2-q">--</div>
                <div class="options-grid" id="p2-options"></div>
            </div>
        </div>

        <div class="info-footer" id="info-msg">Siapa cepat, dia dapat menarik tali!</div>
    </div>

    <script>
        let ropeOffset = 0; // Pergeseran posisi (-110 sampai 110 px)
        let isGameOver = false;

        let p1CurrentAns = 0;
        let p2CurrentAns = 0;

        const tugContainer = document.getElementById("tugContainer");
        const gameStatus = document.getElementById("game-status");
        const infoMsg = document.getElementById("info-msg");

        const p1Q = document.getElementById("p1-q");
        const p1Opts = document.getElementById("p1-options");
        const p2Q = document.getElementById("p2-q");
        const p2Opts = document.getElementById("p2-options");

        function generateP1Question() {
            if (isGameOver) return;
            let n1 = Math.floor(Math.random() * 10) + 1;
            let n2 = Math.floor(Math.random() * 10) + 1;
            p1CurrentAns = n1 + n2;
            p1Q.innerText = `${n1}+${n2}=?`;

            let choices = [p1CurrentAns];
            while(choices.length < 4) {
                let w = p1CurrentAns + Math.floor(Math.random() * 6) - 3;
                if(w !== p1CurrentAns && !choices.includes(w) && w >= 0) choices.push(w);
            }
            choices.sort(() => Math.random() - 0.5);

            p1Opts.innerHTML = "";
            choices.forEach(val => {
                let btn = document.createElement("button");
                btn.className = "btn-opt";
                btn.innerText = val;
                btn.onclick = () => checkAnswer(1, val);
                p1Opts.appendChild(btn);
            });
        }

        function generateP2Question() {
            if (isGameOver) return;
            let n1 = Math.floor(Math.random() * 10) + 1;
            let n2 = Math.floor(Math.random() * 10) + 1;
            p2CurrentAns = n1 + n2;
            p2Q.innerText = `${n1}+${n2}=?`;

            let choices = [p2CurrentAns];
            while(choices.length < 4) {
                let w = p2CurrentAns + Math.floor(Math.random() * 6) - 3;
                if(w !== p2CurrentAns && !choices.includes(w) && w >= 0) choices.push(w);
            }
            choices.sort(() => Math.random() - 0.5);

            p2Opts.innerHTML = "";
            choices.forEach(val => {
                let btn = document.createElement("button");
                btn.className = "btn-opt";
                btn.innerText = val;
                btn.onclick = () => checkAnswer(2, val);
                p2Opts.appendChild(btn);
            });
        }

        function checkAnswer(player, selected) {
            if (isGameOver) return;

            if (player === 1) {
                if (selected === p1CurrentAns) {
                    ropeOffset -= 25; // P1 tarik ke kiri
                    infoMsg.innerText = "P1 Berhasil Menarik! 💪";
                    infoMsg.style.color = "#38bdf8";
                    checkWinCondition();
                    generateP1Question(); // Ganti soal baru buat P1 doang
                } else {
                    ropeOffset += 15; // Penalti salah, tertarik ke kanan dikit
                    infoMsg.innerText = "P1 Salah Jawab! ❌";
                    infoMsg.style.color = "#f43f5e";
                    checkWinCondition();
                }
            } else {
                if (selected === p2CurrentAns) {
                    ropeOffset += 25; // P2 tarik ke kanan
                    infoMsg.innerText = "P2 Berhasil Menarik! 💪";
                    infoMsg.style.color = "#f43f5e";
                    checkWinCondition();
                    generateP2Question(); // Ganti soal baru buat P2 doang
                } else {
                    ropeOffset -= 15; // Penalti salah
                    infoMsg.innerText = "P2 Salah Jawab! ❌";
                    infoMsg.style.color = "#38bdf8";
                    checkWinCondition();
                }
            }

            tugContainer.style.transform = `translateX(${ropeOffset}px)`;
        }

        function checkWinCondition() {
            if (ropeOffset <= -110) {
                isGameOver = true;
                gameStatus.innerText = "P1 MENANG! 🎉";
                infoMsg.innerText = "Pemain 1 (Kiri) Berhasil Menarik Lawan!";
                infoMsg.style.color = "#38bdf8";
                p1Opts.innerHTML = "";
                p2Opts.innerHTML = "";
            } else if (ropeOffset >= 110) {
                isGameOver = true;
                gameStatus.innerText = "P2 MENANG! 🎉";
                infoMsg.innerText = "Pemain 2 (Kanan) Berhasil Menarik Lawan!";
                infoMsg.style.color = "#f43f5e";
                p1Opts.innerHTML = "";
                p2Opts.innerHTML = "";
            }
        }

        // Mulai game
        generateP1Question();
        generateP2Question();
    </script>
</body>
</html>
