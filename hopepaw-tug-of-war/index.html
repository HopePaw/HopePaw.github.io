<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopePaw Tug of War</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-wrapper {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 2px solid #334155;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: #0f172a;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 2px solid #334155;
        }
        .score-left { color: #38bdf8; }
        .score-right { color: #f43f5e; }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #38bdf8, #bae6fd 60%, #4ade80 60%);
            width: 100%;
            height: 220px;
        }

        .quiz-container {
            padding: 20px;
            text-align: center;
            background: #1e293b;
        }
        .question {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #f8fafc;
            letter-spacing: 1px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn-option {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-option:active {
            transform: scale(0.95);
        }
        .btn-option:hover {
            background: #2563eb;
        }
        .message-box {
            margin-top: 15px;
            font-size: 15px;
            min-height: 24px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="score-board">
            <span class="score-left">🐶 HopePaw</span>
            <span id="status-text">Tarik Tambang!</span>
            <span class="score-right">Lawan 🐱</span>
        </div>

        <!-- Area Gambar Murni dari Canvas -->
        <canvas id="gameCanvas" width="450" height="220"></canvas>

        <div class="quiz-container">
            <div class="question" id="question">Loading...</div>
            <div class="options-grid" id="options"></div>
            <div class="message-box" id="message">Jawab dengan benar untuk menarik tali!</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let ropePos = 0; // Pergeseran tali (-100 sampai 100)
        let currentAnswer = 0;
        let isGameOver = false;

        const questionEl = document.getElementById("question");
        const optionsEl = document.getElementById("options");
        const messageEl = document.getElementById("message");
        const statusText = document.getElementById("status-text");

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Garis Tengah / Batas
            ctx.strokeStyle = "#cbd5e1";
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 100);
            ctx.lineTo(canvas.width / 2, 180);
            ctx.stroke();
            ctx.setLineDash([]);

            // 2. Tali Tambang di tengah
            let centerX = canvas.width / 2 + ropePos;
            ctx.strokeStyle = "#b45309";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(80, 140);
            ctx.lineTo(canvas.width - 80, 140);
            ctx.stroke();

            // Bendera penanda di tengah tali
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.moveTo(centerX, 120);
            ctx.lineTo(centerX + 12, 132);
            ctx.lineTo(centerX, 144);
            ctx.fill();

            // 3. Karakter Kiri (HopePaw - Warna Biru/Cyan)
            let hopeX = 80 + ropePos;
            // Badan
            ctx.fillStyle = "#0ea5e9";
            ctx.fillRect(hopeX - 20, 120, 40, 35);
            // Kepala
            ctx.beginPath();
            ctx.arc(hopeX, 110, 18, 0, Math.PI * 2);
            ctx.fill();
            // Telinga HopePaw
            ctx.beginPath();
            ctx.arc(hopeX - 12, 98, 7, 0, Math.PI * 2);
            ctx.arc(hopeX + 12, 98, 7, 0, Math.PI * 2);
            ctx.fill();

            // 4. Karakter Kanan (Lawan - Warna Merah/Pink)
            let lawanX = (canvas.width - 80) + ropePos;
            // Badan
            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(lawanX - 20, 120, 40, 35);
            // Kepala
            ctx.beginPath();
            ctx.arc(lawanX, 110, 18, 0, Math.PI * 2);
            ctx.fill();
            // Telinga Lawan
            ctx.beginPath();
            ctx.arc(lawanX - 12, 98, 7, 0, Math.PI * 2);
            ctx.arc(lawanX + 12, 98, 7, 0, Math.PI * 2);
            ctx.fill();
        }

        function generateQuestion() {
            if (isGameOver) return;
            
            let n1 = Math.floor(Math.random() * 12) + 1;
            let n2 = Math.floor(Math.random() * 12) + 1;
            currentAnswer = n1 + n2;

            questionEl.innerText = `${n1} + ${n2} = ?`;

            let choices = [currentAnswer];
            while (choices.length < 4) {
                let wrong = currentAnswer + Math.floor(Math.random() * 8) - 4;
                if (wrong !== currentAnswer && !choices.includes(wrong) && wrong >= 0) {
                    choices.push(wrong);
                }
            }
            choices.sort(() => Math.random() - 0.5);

            optionsEl.innerHTML = "";
            choices.forEach(val => {
                let btn = document.createElement("button");
                btn.className = "btn-option";
                btn.innerText = val;
                btn.onclick = () => handleAnswer(val);
                optionsEl.appendChild(btn);
            });
        }

        function handleAnswer(selected) {
            if (isGameOver) return;

            if (selected === currentAnswer) {
                ropePos -= 20; // Tarik ke kiri (HopePaw menang)
                messageEl.innerText = "Benar! Tarikan kuat! 💪";
                messageEl.style.color = "#4ade80";
            } else {
                ropePos += 20; // Tarik ke kanan (Lawan menang)
                messageEl.innerText = "Salah! Lawan membalas! 😱";
                messageEl.style.color = "#f87171";
            }

            drawScene();

            // Cek kondisi menang / kalah
            if (ropePos <= -100) {
                isGameOver = true;
                statusText.innerText = "MENANG! 🎉";
                questionEl.innerText = "HOPEPAW MENANG!";
                optionsEl.innerHTML = "";
                messageEl.innerText = "Hebat! Kamu berhasil mengalahkan lawan!";
                messageEl.style.color = "#38bdf8";
                return;
            } else if (ropePos >= 100) {
                isGameOver = true;
                statusText.innerText = "KALAH! 💀";
                questionEl.innerText = "LAWAN MENANG!";
                optionsEl.innerHTML = "";
                messageEl.innerText = "Coba lagi ya, jangan menyerah!";
                messageEl.style.color = "#f43f5e";
                return;
            }

            setTimeout(generateQuestion, 400);
        }

        // Inisialisasi awal
        drawScene();
        generateQuestion();
    </script>
</body>
</html>
