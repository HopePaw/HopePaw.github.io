<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eef4f8">
<title>HopePaw Tug of Math</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#eef4f8;color:#19324a;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
button{font:inherit}
.game{width:100%;min-height:100svh;background:#eef4f8}
.header{height:54px;background:#fff;border-bottom:1px solid #d8e1e8;display:flex;align-items:center;justify-content:center;position:relative}
.brand{font-size:11px;font-weight:900;letter-spacing:.4px;color:#8192a2;border:1px solid #dfe7ed;border-radius:20px;padding:6px 11px;background:#f7fafc}
.brand b{color:#2b87c7}
.mode{position:absolute;right:12px;font-size:8px;color:#a0acb7;border:1px solid #e2e7eb;border-radius:12px;padding:4px 7px}

.board{width:min(100%,1100px);margin:0 auto;padding:12px 10px 24px;display:grid;grid-template-columns:28% 44% 28%;gap:10px;align-items:stretch}
.panel{background:#fff;border:1px solid #d8e0e6;border-radius:14px;box-shadow:0 5px 18px #26435a12;overflow:hidden}
.teamhead{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;color:#fff;font-size:9px;font-weight:900}
.blue .teamhead{background:#178bc6}.red .teamhead{background:#ed564c}
.teamhead span:last-child{background:#fff;color:#4d687d;border-radius:20px;padding:4px 7px;font-size:8px}
.question{padding:11px 9px 5px;text-align:center;font-size:clamp(20px,4.5vw,31px);font-weight:900}
.blue .question{color:#1889c4}.red .question{color:#df4f49}
.input{height:37px;margin:0 9px 6px;border:2px solid #e3e9ee;border-radius:8px;background:#fbfcfd;display:flex;align-items:center;justify-content:center;font-size:16px;color:#7e8c98;font-weight:700}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 9px 9px}
.key{height:38px;border:1px solid #dce4e9;background:#fff;border-radius:9px;box-shadow:0 2px 5px #24435a12;color:#172c3e;font-weight:800;font-size:13px}
.key:active{transform:translateY(1px);background:#f1f6fa}
.action{height:39px;border:0;color:#fff;font-weight:900;font-size:14px;border-radius:9px}
.no{background:#eb4e46}.yes{background:#159dcc}
.center{position:relative;min-height:275px;border-radius:14px;overflow:hidden;border:1px solid #d8e0e6;background:
linear-gradient(90deg,#f7fbfd,#fff 48%,#f7fbfd);box-shadow:0 5px 18px #26435a12}
.centerTop{height:32px;display:flex;align-items:center;justify-content:center;gap:18px;font-size:8px;color:#758697;font-weight:900}
.timer{background:#263e56;color:#fff;padding:5px 9px;border-radius:20px;font-size:8px}
.field{position:absolute;left:0;right:0;top:32px;bottom:0;background:
linear-gradient(90deg,transparent 49.7%,#d8e1e8 49.7%,#d8e1e8 50.3%,transparent 50.3%),
linear-gradient(#fbfdff,#f2f7fa)}
.field:before{content:"";position:absolute;left:50%;top:10px;bottom:8px;border-left:2px dashed #d8e1e8}
.vs{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:5;color:#d9e2e8;font-weight:1000;font-size:14px}
.rope{position:absolute;left:17%;right:17%;top:56%;height:7px;background:#a76b3e;border-radius:8px;z-index:4;box-shadow:0 2px 1px #0002}
.knot{position:absolute;left:50%;top:-6px;width:5px;height:20px;background:#ef4c46;border-radius:4px;transform:translateX(-50%)}
.team{position:absolute;top:42%;width:34%;height:105px;z-index:6}
.team.left{left:4%}.team.right{right:4%;transform:scaleX(-1)}
.person{position:absolute;width:45px;height:78px}
.p1{left:2px;top:6px}.p2{right:0;top:20px}
.person .head{position:absolute;left:12px;top:0;width:25px;height:25px;border-radius:50%;background:#b86d43;border:2px solid #5c3525}
.person .hair{position:absolute;left:2px;top:-2px;width:21px;height:9px;background:#382c28;border-radius:50%}
.person .body{position:absolute;left:7px;top:24px;width:31px;height:31px;border-radius:9px;background:#f0a02e;border:2px solid #9c5c1d}
.person .arm{position:absolute;left:29px;top:30px;width:24px;height:8px;border-radius:8px;background:#b86d43;border:2px solid #5c3525;transform:rotate(-4deg);transform-origin:left}
.person .leg{position:absolute;top:52px;width:21px;height:8px;border-radius:8px;background:#b86d43;border:2px solid #5c3525}
.person .l1{left:6px;transform:rotate(25deg)}.person .l2{left:23px;transform:rotate(-18deg)}
.person.blueperson .body{background:#f2a52f}.person.blueperson .shirt{background:#167bc0}
.person.redperson .body{background:#ed514b}
.team.right .person{transform:scaleX(-1)}
.ropeLine{position:absolute;left:25%;right:25%;top:56%;height:2px;background:#a76b3e;z-index:3}
.goal{position:absolute;left:50%;top:48%;height:58px;border-left:2px solid #8396a5;z-index:2}
.goal:after{content:"";position:absolute;left:2px;top:0;border-top:8px solid #ef4e47;border-right:15px solid transparent}
.hint{position:absolute;bottom:7px;left:0;right:0;text-align:center;color:#a1adb7;font-size:7px;font-weight:800}

.footer{display:none}

@media(max-width:650px){
  .board{grid-template-columns:29% 42% 29%;gap:6px;padding:9px 7px 20px}
  .panel{border-radius:12px}
  .center{min-height:260px}
  .team{width:42%;transform:scale(.86)}.team.right{transform:scaleX(-1) scale(.86)}
  .question{font-size:clamp(16px,4.8vw,26px);padding-top:9px}
  .input{height:34px;font-size:14px}
  .key{height:35px;font-size:12px}
  .keys{gap:4px;padding:0 6px 7px}
  .teamhead{height:29px;font-size:7px;padding:0 6px}
  .teamhead span:last-child{padding:3px 5px}
}
@media(max-width:420px){
  .header{height:43px}.brand{font-size:9px;padding:5px 9px}.mode{font-size:6px;right:6px}
  .board{gap:4px;padding:6px 4px 14px}
  .center{min-height:235px}
  .centerTop{height:27px;font-size:6px;gap:7px}.timer{font-size:6px;padding:4px 6px}
  .field{top:27px}
  .question{font-size:18px;margin-bottom:2px}
  .input{margin:0 5px 4px;height:29px}
  .keys{padding:0 5px 5px;gap:3px}
  .key{height:30px;border-radius:7px;font-size:10px}
  .action{height:31px;font-size:11px}
  .team{top:44%;transform:scale(.72)}.team.right{transform:scaleX(-1) scale(.72)}
  .rope{left:15%;right:15%;top:57%}
}
</style>
</head>
<body>
<div class="game">
  <header class="header">
    <div class="brand">🐾 <b>HOPEPAW</b> MATH ARENA</div>
    <div class="mode">∞ UNLIMITED</div>
  </header>

  <section class="board">
    <div class="panel blue">
      <div class="teamhead"><span>TEAM 1</span><span id="score1">0</span></div>
      <div class="question" id="q1">5 + 5 = ?</div>
      <div class="input" id="in1">0</div>
      <div class="keys">
        <button class="key" data-n="1">1</button><button class="key" data-n="2">2</button><button class="key" data-n="3">3</button>
        <button class="key" data-n="4">4</button><button class="key" data-n="5">5</button><button class="key" data-n="6">6</button>
        <button class="key" data-n="7">7</button><button class="key" data-n="8">8</button><button class="key" data-n="9">9</button>
        <button class="action no" id="clear1">×</button><button class="key" data-n="0">0</button><button class="action yes" id="go1">✓</button>
      </div>
    </div>

    <div class="center">
      <div class="centerTop"><span>TEAM 1</span><span class="timer" id="timer">04:52</span><span>TEAM 2</span></div>
      <div class="field">
        <div class="goal"></div><div class="vs">VS</div>
        <div class="rope"><div class="knot"></div></div>

        <div class="team left" id="team1">
          <div class="person p1 blueperson"><div class="head"><i class="hair"></i></div><div class="body"></div><div class="arm"></div><div class="leg l1"></div><div class="leg l2"></div></div>
          <div class="person p2 blueperson"><div class="head"><i class="hair"></i></div><div class="body"></div><div class="arm"></div><div class="leg l1"></div><div class="leg l2"></div></div>
        </div>

        <div class="team right" id="team2">
          <div class="person p1 redperson"><div class="head"><i class="hair"></i></div><div class="body"></div><div class="arm"></div><div class="leg l1"></div><div class="leg l2"></div></div>
          <div class="person p2 redperson"><div class="head"><i class="hair"></i></div><div class="body"></div><div class="arm"></div><div class="leg l1"></div><div class="leg l2"></div></div>
        </div>
        <div class="hint">Jawab lebih cepat dan benar untuk menarik tali ke sisi HopePaw!</div>
      </div>
    </div>

    <div class="panel red">
      <div class="teamhead"><span>TEAM 2</span><span id="score2">0</span></div>
      <div class="question" id="q2">9 + 9 = ?</div>
      <div class="input" id="in2">0</div>
      <div class="keys">
        <button class="key" data-en="1">1</button><button class="key" data-en="2">2</button><button class="key" data-en="3">3</button>
        <button class="key" data-en="4">4</button><button class="key" data-en="5">5</button><button class="key" data-en="6">6</button>
        <button class="key" data-en="7">7</button><button class="key" data-en="8">8</button><button class="key" data-en="9">9</button>
        <button class="action no" id="clear2">×</button><button class="key" data-en="0">0</button><button class="action yes" id="go2">✓</button>
      </div>
    </div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
let a1="",a2="",score1=0,score2=0,correct1=10,correct2=18,position=0;
let seconds=292,locked1=false,locked2=false;

function makeQ(side){
  const a=Math.floor(Math.random()*9)+1,b=Math.floor(Math.random()*9)+1;
  const op=Math.random()<.75?"+":"−";
  const ans=op==="+"?a+b:a-b;
  if(side===1){correct1=ans;$("q1").textContent=`${a} ${op} ${b} = ?`;a1="";$("in1").textContent="0"}
  else{correct2=ans;$("q2").textContent=`${a} ${op} ${b} = ?`;a2="";$("in2").textContent="0"}
}
function press(side,n){
  if(side===1){if(a1.length<3){a1+=n;$("in1").textContent=a1||"0"}}
  else{if(a2.length<3){a2+=n;$("in2").textContent=a2||"0"}}
}
function submit(side){
  if(side===1){
    if(Number(a1)===correct1){score1++;position=Math.min(48,position+5);locked1=false;makeQ(1);flash(1,true)}
    else{position=Math.max(-48,position-3);flash(1,false)}
    $("score1").textContent=score1;
  }else{
    if(Number(a2)===correct2){score2++;position=Math.max(-48,position-5);locked2=false;makeQ(2);flash(2,true)}
    else{position=Math.min(48,position+3);flash(2,false)}
    $("score2").textContent=score2;
  }
  moveTeams();
}
function flash(side,good){
  const el=$(side===1?"in1":"in2");
  el.style.borderColor=good?"#18a96b":"#ed564c";
  setTimeout(()=>el.style.borderColor="#e3e9ee",250);
}
function moveTeams(){
  const rope=document.querySelector(".rope");
  rope.style.transform=`translateX(${position}px)`;
  $("team1").style.transform=`translateX(${position*.45}px)`;
  $("team2").style.transform=`scaleX(-1) translateX(${position*.45}px)`;
  if(position>=48||position<=-48){
    const win=position>=48?"HOPEPAW WINS!":"TEAM 2 WINS!";
    setTimeout(()=>alert(win),80);
    position=0;score1=score2=0;$("score1").textContent=0;$("score2").textContent=0;moveTeams();
  }
}
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>press(1,b.dataset.n));
document.querySelectorAll("[data-en]").forEach(b=>b.onclick=()=>press(2,b.dataset.en));
$("clear1").onclick=()=>{a1="" ;$("in1").textContent="0"};
$("clear2").onclick=()=>{a2="" ;$("in2").textContent="0"};
$("go1").onclick=()=>submit(1);$("go2").onclick=()=>submit(2);
document.addEventListener("keydown",e=>{
  if(e.key>="0"&&e.key<="9")press(1,e.key);
  if(e.key==="Enter")submit(1);
});
setInterval(()=>{
  seconds--;if(seconds<0)seconds=292;
  const m=Math.floor(seconds/60),s=seconds%60;
  $("timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
},1000);
makeQ(1);makeQ(2);moveTeams();
</script>
</body>
</html>
