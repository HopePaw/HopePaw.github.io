<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopePaw</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0f172a;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            text-align:center;
            padding:20px;
        }

        .container{
            max-width:700px;
        }

        h1{
            font-size:55px;
            color:#4da3ff;
            margin-bottom:15px;
        }

        h2{
            color:white;
            font-weight:normal;
            margin-bottom:25px;
        }

        p{
            font-size:20px;
            line-height:1.8;
            color:#d1d5db;
        }

        .btn{
            display:inline-block;
            margin-top:35px;
            background:#4da3ff;
            color:white;
            text-decoration:none;
            padding:15px 35px;
            border-radius:12px;
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            background:#2d8cff;
            transform:scale(1.05);
        }

        footer{
            margin-top:45px;
            color:#94a3b8;
            font-size:15px;
        }
    </style>

</head>

<body>

<div class="container">

<h1>🐾 HopePaw</h1>

<h2>A Meme With A Mission</h2>

<p>
Supporting orphanages & children's education.
<br><br>
Built with transparency.
<br>
Powered by community. ❤️
</p>

<a class="btn"
href="https://x.com/HopePawHQ"
target="_blank"
rel="noopener noreferrer">
Follow @HopePawHQ on X
</a>

<footer>

<p>
Building hope, one paw at a time. 💙
</p>

</footer>

</div>

</body>
</html>
