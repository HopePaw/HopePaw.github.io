<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HopePaw — A Meme with a Mission</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .logo {
      width: 140px;
      height: auto;
      margin-bottom: 20px;
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
    }

    p.description {
      font-size: 1rem;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 28px;
    }

    .btn-x {
      display: inline-block;
      background-color: #000000;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px 24px;
      border-radius: 50px;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn-x:hover {
      background-color: #27272a;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="1785989730239.png" alt="HopePaw Logo" class="logo">
    
    <h1>🐾 HopePaw</h1>
    
    <p class="description">
      A meme with a mission.<br>
      Supporting orphanages &amp; children's education.<br>
      Built with transparency. Powered by community. ❤️
    </p>

    <a href="https://x.com/HopePawHQ" target="_blank" class="btn-x">
      Follow @HopePawHQ on X
    </a>
  </div>

</body>
</html>
